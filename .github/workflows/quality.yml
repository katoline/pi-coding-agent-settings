name: Quality
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - run: docker build -t pi-harness:1.3.0 .
      - run: node scripts/sandbox-smoke.mjs
  nix:
    name: nix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Evaluate locked Nix configuration
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work
          nixos/nix@sha256:e2bff159b88c242722022a273d3832a4392f01dba35b796204d852b89042526e
          nix --extra-experimental-features 'nix-command flakes' flake check --no-build path:/work
